name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q fwplatform analyzers tests
      - run: python -m unittest discover -s tests -v
      - run: python -m fwplatform.cli --db database/ci-test.sqlite coverage --json
      - run: python -m fwplatform.cli --db database/ci-test.sqlite analyze semantic --json
      - run: python -m fwplatform.cli --db database/ci-test.sqlite graph export --format json --output database/ci-graph.json --json

